# ruff — fast Python linter + formatter (https://github.com/astral-sh/ruff)
# Style: 4-space indent, double quotes, no semicolons (per AGENTS.md).
line-length = 100
target-version = "py311"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501", # line-too-long handled by formatter; keep lenient in lint
    "B008", # function call in default arg (Click opts use this)
    "SIM105", # use contextlib.suppress — noisy for this codebase
    "RUF012", # mutable class attribute default (intentional shared config/headers)
    "SIM115", # file open without context manager (binary reads; handled per-call)
    "SIM108", # if-else assignment -> ternary (style; keep explicit blocks)
    "SIM102", # nested if -> single if (style)
    "RUF001", # ambiguous unicode (en-dash in user-facing strings is intentional)
]

[lint.per-file-ignores]
"tests/*" = ["B", "UP"]

[format]
quote-style = "double"
indent-style = "space"
