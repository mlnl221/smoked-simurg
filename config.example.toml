# config.example.toml — copy to config.toml and fill; DO NOT COMMIT config.toml
[directory]
upload_directory = ".books"
dottorrents_dir = ".torrents"
staging_dir = ".staging"  # renamed files are moved here before torrent creation; if empty, uses upload_directory

[image]
cover_uploader = "ptscreens"  # ptscreens|imgbb|catbox
ptscreens_key = ""
imgbb_key = ""
catbox_userhash = ""  # optional

[metadata]
googlebooks_key = ""
cover_fallback_duckduckgo = true
librarything_token = ""  # LibraryThing Talpa API token (also used as REST apikey)
openalex_api_key = ""  # OpenAlex /sources API key (free, https://openalex.org/settings/api) — required for ISSN lookup

[tracker.simurg]
session = ""          # browser cookie
# api_key = ""        # optional
announce_url = ""     # if empty, derive from passkey via ajax.php?action=index; else use personal URL https://tracker.simurg.world/.../announce
# dottorrents_dir = ".torrents/simurg"

[upload]
user_agent = "simurg/0.1.0"
# Editor for interactive metadata review (click.edit). Blank = $EDITOR, then nano.
default_editor = ""
log_dupe_tolerance = 0.5
check_recent_uploads = true
check_requests = true
copy_uploaded_url_to_clipboard = false
debug_tracker_connection = false

[client]
# Push each uploaded .torrent to qBittorrent after tracker upload (warn-only,
# never fails the upload). Disabled by default.
enabled = false
# libtc URL of qbit WebUI (host reachable from here, e.g. your NAS):
# torrent_client = "qbittorrent+http://USER:PASS@192.168.1.10:8080"
torrent_client = ""
# NAS-local view of seed dir (passed as save_path to qbit, qbit must see it):
# save_path = "/downloads/simurg"
save_path = ""
# WSL-local view of the SAME dir (mounted NAS share; content copied here first):
# local_path = "/mnt/nas/downloads/simurg"
local_path = ""
category = "simurg"
add_paused = false
